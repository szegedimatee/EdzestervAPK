name: Build Ironman Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Setup Project and Dependencies
        run: |
          # Create Android native wrapper
          flutter create --org hu.ironman.edzesterv --project-name edzesterv .
          
          # Replace with our custom files
          cp main.dart lib/main.dart
          mkdir -p assets
          cp edzesterv_adatbazis.csv assets/
          cp custom_pubspec.yaml pubspec.yaml
          
          flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: edzesterv-ironman-apk
          path: build/app/outputs/flutter-apk/app-release.apk
